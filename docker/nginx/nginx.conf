upstream jobpilot_api {
    server api:4101;
}

upstream jobpilot_web {
    server web:4100;
}

upstream jobpilot_terminal {
    server terminal:4102;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Same-origin check for /terminal/:
# If the browser's Origin header matches the exact Nginx origin ($scheme://$http_host) or
# http://$http_host / https://$http_host (e.g. behind TLS termination), rewrite Origin to
# http://web:4100 (which is in Terminal's AllowedOrigins) so any localhost port, LAN IP,
# Tailscale IP, or domain works out-of-the-box without 403.
# Foreign origins (CSWSH/CSRF from another site) do not match $http_host and are passed
# through untouched so OriginPolicy.cs rejects them with 403 Forbidden.
map "$http_origin|$http_host" $terminal_origin {
    default $http_origin;
    "~^https?://(?<h>[^/|]+)\|\k<h>$" "http://web:4100";
    "~^\|" "";
}

server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 25M;

    # 1. JobPilot API (/api/*) - SSE unbuffered
    location /api/ {
        proxy_pass http://jobpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Redirect bare /terminal to /terminal/
    location = /terminal {
        return 301 /terminal/;
    }

    # 2. Containerized JobPilot Terminal Host (/terminal/* -> terminal:4102/*)
    # Enforces same-origin against $http_host while forwarding foreign origins to OriginPolicy.cs
    location /terminal/ {
        rewrite ^/terminal/(.*)$ /$1 break;
        proxy_pass http://jobpilot_terminal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $terminal_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # 3. Next.js static assets
    location /_next/static {
        proxy_pass http://jobpilot_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 4. JobPilot Web App (/)
    location / {
        proxy_pass http://jobpilot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
